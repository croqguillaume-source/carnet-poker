<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carnet Poker — Le labo des trois</title>
<meta name="description" content="Carnet poker à trois — planning, étude, sessions, review des leaks, bankroll." />
<!--
  Page d'entree du depot. Sans elle, l'URL racine
  https://croqguillaume-source.github.io/carnet-poker/ renvoie une 404.

  Trois voies de redirection, volontairement redondantes :
  1. la balise meta refresh, qui marche meme sans JavaScript ;
  2. location.replace, plus rapide, et qui n'ajoute pas d'entree dans
     l'historique — le bouton Retour du navigateur ne rebondit donc pas
     ici en boucle ;
  3. les deux liens ci-dessous, visibles si les deux premieres echouent.

  Chemins RELATIFS : le site est publie dans un sous-dossier (/carnet-poker/),
  un chemin absolu commencant par une barre oblique pointerait a cote.
-->
<meta http-equiv="refresh" content="0; url=carnet-poker.html" />
<link rel="canonical" href="carnet-poker.html" />
<style>
  :root{
    --paper:#0B1412; --card:#122220; --ink:#E8E4D9; --ink-soft:#B4C2BB;
    --clay:#4FD1A5; --clay-soft:#7FE0C0; --line:#25403A; --muted:#8FA39D;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:'Public Sans',-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  .box{max-width:460px;width:100%;background:var(--card);border:1px solid var(--line);
    border-radius:4px;padding:28px;box-shadow:0 2px 14px rgba(0,0,0,.35);}
  .kicker{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:10px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  h1{font-family:Impact,'Archivo Black',sans-serif;font-weight:400;font-size:26px;
    line-height:1.1;letter-spacing:-.02em;text-transform:uppercase;margin-bottom:12px;}
  h1 em{font-style:normal;color:var(--clay);}
  p{color:var(--ink-soft);font-size:14.5px;margin-bottom:18px;}
  a.btn{display:block;text-align:center;text-decoration:none;border-radius:4px;
    padding:12px 16px;font-family:ui-monospace,'JetBrains Mono',monospace;font-size:11px;
    font-weight:700;letter-spacing:.1em;text-transform:uppercase;transition:.15s;}
  a.primary{background:var(--clay);border:1px solid var(--clay);color:#08120F;margin-bottom:10px;}
  a.primary:hover{background:var(--clay-soft);border-color:var(--clay-soft);}
  a.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);}
  a.ghost:hover{background:var(--line);color:var(--ink);}
</style>
</head>
<body>
  <div class="box">
    <div class="kicker">Le labo des trois</div>
    <h1>Carnet <em>poker</em></h1>
    <p>Redirection vers le carnet en cours. Si rien ne se passe, choisis ci-dessous.</p>
    <a class="btn primary" href="carnet-poker.html">Ouvrir le carnet</a>
    <a class="btn ghost" href="guide-poker.html">Ouvrir le guide d'étude</a>
  </div>
  <script>
    // replace() plutot que href : evite que le bouton Retour ramene ici,
    // ce qui renverrait aussitot vers le carnet — une boucle sans sortie.
    location.replace('carnet-poker.html');
  </script>
</body>
</html>
